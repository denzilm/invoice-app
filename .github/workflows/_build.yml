name: Build and Push

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      apiName:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      api_test_filter:
        required: true
        type: string
      ecr-registry:
        required: true
        type: string
      build-configuration:
        required: true
        type: string
      dotnet_version:
        required: true
        type: string
    secrets:
        AWS_ROLE_ARN:
            required: true
    outputs:
      image-tag:
        value: ${{ jobs.test.outputs.image-tag }}

permissions:
  contents: read
  id-token: write
  checks: write

jobs:
  test:
    name: Build and Test API
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration ${{ inputs.build-configuration }}
      - name: Test
        run: dotnet test --filter ${{ inputs.api_test_filter }} --configuration ${{ inputs.build-configuration }} --no-build --verbosity normal --logger trx --results-directory ./test-results --collect:"XPlat Code Coverage"
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.apiName }}-test-results
          path: ./test-results/**/*
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ${{ inputs.apiName }} Tests
          path: ./test-results/**/*.trx
          reporter: dotnet-trx
  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Generate Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.ecr-registry }}/${{ inputs.apiName }}
          tags: |
            type=raw,value=${{ needs.test.outputs.image-tag }}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}

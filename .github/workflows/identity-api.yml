name: Identity API

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - hotfix/*
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  checks: write

jobs:
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.filter.outputs.changed == 'true' || steps.bypass.outputs.bypass == 'true'}}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - 'src/ServiceA/**'
              - 'src/Shared/**'
              - 'infra/ServiceA/**'
              - 'infra/Shared/**'
              - '.github/workflows/service-a.yml'
              - '.github/workflows/_shared.yml'
              - '.github/workflows/_build.yml'
              - '.github/workflows/_build-migrations.yml'
              - '.github/workflows/_migrate.yml'
              - '.github/workflows/_deploy.yml'
              - '.github/workflows/_version.yml'

      # Always run on release, hotfix branches and tags regardless of changed files
      - name: Bypass path filter
        id: bypass
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]] || \
             [[ "${{ github.ref }}" == refs/heads/hotfix/* ]] || \
             [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "bypass=true" >> $GITHUB_OUTPUT
          else
            echo "bypass=false" >> $GITHUB_OUTPUT
          fi
  version:
    name: Get Version
    needs: check-paths
    uses: ./.github/workflows/_version.yml
    with:
      gitversion-config: Identity/src/FrontendMentor.InvoiceApp.Identity.Api/GitVersion.yml

  shared-development:
    needs: check-paths
    if: |
      needs.check-paths.outputs.should-run == 'true' &&
      github.ref_name == 'develop'
    name: Deploy Shared Infrastructure (Development)
    uses: ./.github/workflows/_shared.yml
    with:
      environment: Development
    secrets:
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}

  deploy-identity-api-stack-development:
    name: Deploy Identity API Stack (Development)
    needs: [ version, shared-development ]
    uses: ./.github/workflows/_deploy-service-stack.yml
    with:
      environment: Development
      apiName: invoice-app-identity-api
      service-stack-directory: Infrastructure/FrontendMentor.InvoiceApp.Infrastructure.Identity
      cluster: ${{ needs.shared-development.outputs.cluster-name }}
      image-tag: ${{ needs.version.outputs.image-tag }}
      git-commit: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}

  build-development:
    name: Build Identity API
    needs: [version, shared-development]
    uses: ./.github/workflows/_build.yml
    with:
      environment: Development
      apiName: invoice-app-identity-api
      context: .
      dockerfile: Identity/src/FrontendMentor.InvoiceApp.Identity.Api/Dockerfile
      image-tag: ${{ needs.version.outputs.image-tag }}
      ecr-registry: ${{ needs.shared-development.outputs.ecr-registry }}
      build-configuration: Release
      dotnet_version: 10.x
      api_test_filter: "FullyQualifiedName~FrontendMentor.InvoiceApp.Identity"
    secrets:
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}

  build-migrations-development:
    name: Build Identity API Migrations Image
    needs: [version, shared-development]
    uses: ./.github/workflows/_build-migrations.yml
    with:
      environment: Development
      apiName: invoice-app-identity-api
      context: .
      dockerfile: Identity/src/FrontendMentor.InvoiceApp.Identity.Api/Dockerfile.migrations
      image-tag: ${{ needs.version.outputs.image-tag }}
      ecr-registry: ${{ needs.shared-development.outputs.ecr-registry }}
    secrets:
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}

  migrate-development:
    name: Run Identity API Migrations
    needs: [shared-development, deploy-identity-api-stack-development, build-migrations-development]
    uses: ./.github/workflows/_migrate.yml
    with:
      environment: Development
      apiName: invoice-app-identity-api
      cluster: ${{ needs.shared-development.outputs.cluster-name }}
    secrets:
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}

  deploy-identity-api-development:
    name: Deploy Identity API (Development)
    needs: [version, shared-development, migrate-development]
    uses: ./.github/workflows/_deploy-service.yml
    with:
      environment: Development
      apiName: invoice-app-identity-api
      service-stack-directory: Infrastructure/FrontendMentor.InvoiceApp.Infrastructure.Identity
      cluster: ${{ needs.shared-development.outputs.cluster-name }}
      image-tag: ${{ needs.version.outputs.image-tag }}
      git-commit: ${{ github.sha }}
    secrets:
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}

  shared-staging:
    needs: check-paths
    if: |
      needs.check-paths.outputs.should-run == 'true' &&
      startsWith(github.ref, 'refs/heads/release/')
    name: Deploy Shared Infrastructure (Staging)
    uses: ./.github/workflows/_shared.yml
    with:
      environment: Staging
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}

  deploy-identity-api-stack-staging:
    name: Deploy Identity API Stack (Staging)
    needs: [ version, shared-staging ]
    uses: ./.github/workflows/_deploy-service-stack.yml
    with:
      environment: Staging
      apiName: invoice-app-identity-api
      service-stack-directory: Infrastructure/FrontendMentor.InvoiceApp.Infrastructure.Identity
      cluster: ${{ needs.shared-staging.outputs.cluster-name }}
      image-tag: ${{ needs.version.outputs.image-tag }}
      git-commit: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}

  build-staging:
    name: Build Identity API
    needs: [ version, shared-staging ]
    uses: ./.github/workflows/_build.yml
    with:
      environment: Staging
      apiName: invoice-app-identity-api
      context: .
      dockerfile: Identity/src/FrontendMentor.InvoiceApp.Identity.Api/Dockerfile
      image-tag: ${{ needs.version.outputs.image-tag }}
      ecr-registry: ${{ needs.shared-staging.outputs.ecr-registry }}
      build-configuration: Release
      dotnet_version: 10.x
      api_test_filter: "FullyQualifiedName~FrontendMentor.InvoiceApp.Identity"
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}

  build-migrations-staging:
    name: Build Identity API Migrations Image
    needs: [ version, shared-staging ]
    uses: ./.github/workflows/_build-migrations.yml
    with:
      environment: Staging
      apiName: invoice-app-identity-api
      context: .
      dockerfile: Identity/src/FrontendMentor.InvoiceApp.Identity.Api/Dockerfile.migrations
      image-tag: ${{ needs.version.outputs.image-tag }}
      ecr-registry: ${{ needs.shared-staging.outputs.ecr-registry }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}

  migrate-staging:
    name: Run Identity API Migrations
    needs: [ shared-staging, deploy-identity-api-stack-staging, build-migrations-staging ]
    uses: ./.github/workflows/_migrate.yml
    with:
      environment: Staging
      apiName: invoice-app-identity-api
      cluster: ${{ needs.shared-staging.outputs.cluster-name }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}

  deploy-identity-api-staging:
    name: Deploy Identity API (Development)
    needs: [ version, shared-staging, migrate-staging ]
    uses: ./.github/workflows/_deploy-service.yml
    with:
      environment: Staging
      apiName: invoice-app-identity-api
      service-stack-directory: Infrastructure/FrontendMentor.InvoiceApp.Infrastructure.Identity
      cluster: ${{ needs.shared-staging.outputs.cluster-name }}
      image-tag: ${{ needs.version.outputs.image-tag }}
      git-commit: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_STG }}

  shared-production:
    needs: check-paths
    if: startsWith(github.ref, 'refs/tags/')
    name: Deploy Shared Infrastructure (Production)
    uses: ./.github/workflows/_shared.yml
    with:
      environment: Production
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_PROD }}

  deploy-identity-api-stack-production:
    name: Deploy Identity API Stack (Staging)
    needs: [ version, shared-production ]
    uses: ./.github/workflows/_deploy-service-stack.yml
    with:
      environment: Production
      apiName: invoice-app-identity-api
      service-stack-directory: Infrastructure/FrontendMentor.InvoiceApp.Infrastructure.Identity
      cluster: ${{ needs.shared-production.outputs.cluster-name }}
      image-tag: ${{ needs.version.outputs.image-tag }}
      git-commit: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_PROD }}

  build-production:
    name: Build Identity API
    needs: [ version, shared-production ]
    uses: ./.github/workflows/_build.yml
    with:
      environment: Production
      apiName: invoice-app-identity-api
      context: .
      dockerfile: Identity/src/FrontendMentor.InvoiceApp.Identity.Api/Dockerfile
      image-tag: ${{ needs.version.outputs.image-tag }}
      ecr-registry: ${{ needs.shared-production.outputs.ecr-registry }}
      build-configuration: Release
      dotnet_version: 10.x
      api_test_filter: "FullyQualifiedName~FrontendMentor.InvoiceApp.Identity"
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_PROD }}

  build-migrations-production:
    name: Build Identity API Migrations Image
    needs: [ version, shared-production ]
    uses: ./.github/workflows/_build-migrations.yml
    with:
      environment: Production
      apiName: invoice-app-identity-api
      context: .
      dockerfile: Identity/src/FrontendMentor.InvoiceApp.Identity.Api/Dockerfile.migrations
      image-tag: ${{ needs.version.outputs.image-tag }}
      ecr-registry: ${{ needs.shared-production.outputs.ecr-registry }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_PROD }}

  migrate-production:
    name: Run Identity API Migrations
    needs: [ shared-production, deploy-identity-api-stack-production, build-migrations-production ]
    uses: ./.github/workflows/_migrate.yml
    with:
      environment: Production
      apiName: invoice-app-identity-api
      cluster: ${{ needs.shared-production.outputs.cluster-name }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_PROD }}

  deploy-identity-api-production:
    name: Deploy Identity API (Production)
    needs: [ version, shared-production, migrate-production ]
    uses: ./.github/workflows/_deploy-service.yml
    with:
      environment: Production
      apiName: invoice-app-identity-api
      service-stack-directory: Infrastructure/FrontendMentor.InvoiceApp.Infrastructure.Identity
      cluster: ${{ needs.shared-production.outputs.cluster-name }}
      image-tag: ${{ needs.version.outputs.image-tag }}
      git-commit: ${{ github.sha }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_PROD }}

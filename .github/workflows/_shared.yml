name: Deploy Shared Infrastructure
on:
  workflow_call:
    inputs:
        environment:
            description: The environment to deploy to (e.g., Development, Staging, Production)
            required: true
            type: string
    secrets:
        AWS_ROLE_ARN:
            required: true
    outputs:
      ecr-registry:
        description: ECR registry URL for API images
        value: ${{ jobs.deploy.outputs.ecr-registry }}
      cluster-name:
        description: ECS cluster name
        value: ${{ jobs.deploy.outputs.cluster-name }}

jobs:
  deploy:
    name: Deploy Shared Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
        contents: read
        id-token: write
    outputs:
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
      cluster-name: ${{ steps.cdk.outputs.cluster-name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Shared Stack
        id: cdk
        working-directory: Infrastructure/FrontendMentor.InvoiceApp.Infrastructure.Core
        run: |
          cdk deploy --require-approval never --outputs-file cdk-outputs.json
          echo "cluster-name=$(jq -r '.. | .ClusterName? // empty' cdk-outputs.json)" >> $GITHUB_OUTPUT
        env:
          ENVIRONMENT: ${{ inputs.environment }}

name: Determine Version

on:
  workflow_call:
    inputs:
      gitversion-config:
        description: Path to GitVersion configuration file
        required: true
        type: string
    outputs:
      image-tag:
        description: The image tag based on GitVersion
        value: ${{ jobs.version.outputs.image-tag }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: ${{ inputs.gitversion-config }}

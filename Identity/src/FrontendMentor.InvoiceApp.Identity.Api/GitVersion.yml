mode: ContinuousDelivery
next-version: 0.0.0

major-version-bump-message: '^(break|breaking)'
minor-version-bump-message: '^(feat|feature)'
patch-version-bump-message: '^(fix|patch|chore|build|ci)'

branches:
  main:
    label: ''
    increment: Patch
  develop:
    label: 'beta'
    increment: Minor
  feature:
    regex: '^(feature|feat)[/-]'
    label: 'preview'
    increment: Inherit       # inherits from develop
  release:
    regex: '^release[/-]'
    label: 'rc'
    increment: None          # version is set by the release branch name
  hotfix:
    regex: '^hotfix[/-]'
    label: 'hotfix'
    increment: Patch
  pull-request:
    label: 'pr'
